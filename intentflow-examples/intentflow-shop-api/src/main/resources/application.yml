spring:
  application:
    name: intentflow-shop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/intentflow}
    username: ${DB_USER:intentflow}
    password: ${DB_PASSWORD:intentflow}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mvc:
    problemdetails:
      enabled: true
  autoconfigure:
    exclude:
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
  jpa:
    open-in-view: false

openmapper:
  dao:
    packagesToScan: io.github.serfom256.intentflow.examples.shop.openmapper
  model:
    packagesToScan: io.github.serfom256.intentflow.examples.shop.openmapper

intentflow:
  executor: openmapper
  catalog:
    packages: io.github.serfom256.intentflow.examples.shop.openmapper
  llm:
    base-url: ${LLM_URL:http://localhost:1234/v1}
    model: ${LLM_MODEL:qwen/qwen3.8-27b}
    api-key: ${LLM_API_KEY:}
    timeout: 120s
  cache:
    ttl: 30m
  admin:
    security:
      password: ${INTENTFLOW_ADMIN_PASSWORD:admin}

logging:
  level:
    io.github.serfom256.intentflow: DEBUG

---
spring:
  config:
    activate:
      on-profile: jpa
  autoconfigure:
    exclude: io.github.serfom256.config.OpenMapperConfig
intentflow:
  executor: jpa
  catalog:
    packages: io.github.serfom256.intentflow.examples.shop.jpa

---
spring:
  config:
    activate:
      on-profile: jimmer
  autoconfigure:
    exclude:
      - io.github.serfom256.config.OpenMapperConfig
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
intentflow:
  executor: jimmer
  catalog:
    packages: io.github.serfom256.intentflow.examples.shop.jimmer

---
spring:
  config:
    activate:
      on-profile: jdbc
  autoconfigure:
    exclude:
      - io.github.serfom256.config.OpenMapperConfig
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
intentflow:
  executor: jdbc
  catalog:
    packages: io.github.serfom256.intentflow.examples.shop.jdbc

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/intentflow}
