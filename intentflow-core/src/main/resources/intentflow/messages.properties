intentflow.declined=This question cannot be answered: {reason}
intentflow.parse=The question could not be turned into a query. Try rephrasing it.
intentflow.invalid-query=The question could not be turned into a valid query. Try rephrasing it.
intentflow.unknown-field=There is no field "{field}" to search by.
intentflow.unknown-relation=There is no "{relation}" to search through.
intentflow.type-mismatch=A value in the question does not fit the field it is compared with.
intentflow.limit-exceeded=The question asks for more than allowed: at most {limit}.
intentflow.unsupported=This kind of question is not supported.
intentflow.service-not-found=There is nothing called "{service}" to search.
intentflow.access-denied=You may not search {service}.
intentflow.rate-limited=Too many new questions. Try again in {retryAfterSeconds} seconds.
intentflow.scan-limit=The question is too broad. Add a condition and try again.
intentflow.llm-failed=The search assistant did not answer. Try again later.
intentflow.llm-unavailable=The search assistant is busy. Try again in a moment.
intentflow.uri-build=The link to the result could not be built.
intentflow.invalid-cursor=The page link no longer matches the question. Start again from the first page.
