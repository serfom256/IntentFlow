[versions]
assertj = "3.27.3"
caffeine = "3.1.8"
h2 = "2.3.232"
jimmer = "0.12.3"
jspecify = "1.0.0"
junit = "5.11.4"
lombok = "1.18.42"
openmapper = "2.1.0"
slf4j = "2.0.17"
springBoot = "4.0.0"
testcontainers = "2.0.2"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
jimmer-sql = { module = "org.babyfish.jimmer:jimmer-sql", version.ref = "jimmer" }
jimmer-apt = { module = "org.babyfish.jimmer:jimmer-apt", version.ref = "jimmer" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
openmapper = { module = "io.github.serfom256:openmapper-spring-boot-starter", version.ref = "openmapper" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-jdbc = { module = "org.springframework.boot:spring-boot-jdbc" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc" }
spring-boot-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-data-cassandra = { module = "org.springframework.boot:spring-boot-starter-data-cassandra" }
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-liquibase = { module = "org.springframework.boot:spring-boot-starter-liquibase" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

spring-jdbc = { module = "org.springframework:spring-jdbc" }
spring-orm = { module = "org.springframework:spring-orm" }
spring-data-jdbc = { module = "org.springframework.data:spring-data-jdbc" }
spring-data-cassandra = { module = "org.springframework.data:spring-data-cassandra" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core" }
cassandra-driver-core = { module = "org.apache.cassandra:java-driver-core" }

postgresql = { module = "org.postgresql:postgresql" }
mysql = { module = "com.mysql:mysql-connector-j" }

testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql", version.ref = "testcontainers" }
testcontainers-cassandra = { module = "org.testcontainers:testcontainers-cassandra", version.ref = "testcontainers" }

[bundles]
testing = ["junit-jupiter", "assertj-core"]

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
node-gradle = { id = "com.github.node-gradle.node", version = "7.1.0" }
