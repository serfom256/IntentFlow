name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: >
          ./gradlew build
          -PjavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64

  consumer-resolution:
    name: Consumer resolution (Boot ${{ matrix.boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: ['4.0.0', '4.1.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: gradle/actions/setup-gradle@v4
      - name: Install IntentFlow to the local repository
        run: ./gradlew publishToMavenLocal -x test
      - name: Assert the starter resolves cleanly inside a Boot application
        run: .github/scripts/consumer-probe.sh "${{ matrix.boot }}"
