name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: |
            ${{ matrix.java }}
            21
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Build and test
        run: >
          ./gradlew build
          -PjavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_${{ matrix.java }}_X64

  consumer-resolution:
    name: Consumer resolution (Boot ${{ matrix.boot }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: ['4.0.0', '4.1.1']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-probe-${{ matrix.boot }}-${{ hashFiles('.github/scripts/consumer-probe.sh', 'gradle/libs.versions.toml') }}
          restore-keys: maven-probe-${{ matrix.boot }}-
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Install IntentFlow to the local repository
        run: ./gradlew publishToMavenLocal -x test
      - name: Assert the starter resolves cleanly inside a Boot application
        run: .github/scripts/consumer-probe.sh "${{ matrix.boot }}"
